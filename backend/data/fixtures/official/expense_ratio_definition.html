  <title>What is expense ratio</title>
</head>
<body>
  <h1>Expense ratio</h1>
  <p>
    The expense ratio represents the annual fund operating expenses of a scheme,
    expressed as a percentage of the fund’s daily net assets. For example, an
    expense ratio of 1% per annum means that each year 1% of the fund’s total
    assets will be used to cover expenses.
  </p>
</body>
